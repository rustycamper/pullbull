name: Secrets
# Every change, docs included: a token pasted into a doc is what this catches.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No secrets
        run: bash scripts/check-no-secrets.sh
