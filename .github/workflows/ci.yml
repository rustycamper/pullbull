name: CI
# Docs-only changes skip the macOS job; secrets.yml still scans them.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Kit tests
        run: swift test --package-path Packages/PullBullKit
      - name: App build
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -scheme PullBull -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build | tee build.log
          ! grep -E '\.swift:[0-9]+:[0-9]+: warning:' build.log
      - name: Release build (unsigned)
        run: |
          xcodebuild -scheme PullBull -configuration Release -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build | tee release-build.log
          ! grep -E '\.swift:[0-9]+:[0-9]+: warning:' release-build.log
